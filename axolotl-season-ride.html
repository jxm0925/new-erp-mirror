    <div class="control-left"><button type="button" class="control-btn primary" id="pause" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path id="pause-icon" d="M5 3h3v14H5zm7 0h3v14h-3z"/></svg><span id="pause-label">暂停漫游</span></button><button type="button" class="control-btn" id="jump"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 2 7 7-2 2-4-4v11H8V7l-4 4-2-2z"/></svg>跳一下<span class="key" aria-hidden="true">空格</span></button><div class="auto"><span></span>遇到障碍，旅伴会自动起跳</div></div>
    <div class="control-right"><label class="speed" for="speed">骑行速度<input id="speed" type="range" min="0.6" max="1.6" step="0.1" value="1" aria-label="骑行速度"><output id="speed-label" for="speed">1.0×</output></label></div>
  </div>
  <footer class="caption"><span><strong>慢一点也没关系。</strong> &nbsp; 四季很长，我们慢慢骑。</span><span class="credit">像素小骑士 × 二八大杠 × 机械鹈鹕</span></footer>
  <p class="status" id="status" role="status" aria-live="polite">正在鲜花平原骑行</p><p id="fatal" role="alert" hidden></p>
</main>
<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const stage = document.querySelector('.stage');
  let season = 'spring', running = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let time = 0, travel = 0, distance = 0, speed = 1, jumps = 0, jump = null, nextObstacle = 900, last = 0;
  let obstacles = [], flakes = [];
  const baseX = 610, ground = 540;
  const themes = {
    spring: {index:'01', en:'SPRING', name:'风吹过鲜花平原', desc:'把烦恼留在身后，把春天装进口袋。', route:'鲜花平原 · 春日环线', sky:'#e2edd1', ground:'#a8c780', road:'#e6d5ae', edge:'#f3e4c1', sun:'#f4d88d'},
    summer: {index:'02', en:'SUMMER', name:'骑向沙海的秘密', desc:'穿过金色沙丘，去听古老遗迹的故事。', route:'金字塔遗迹 · 沙漠环线', sky:'#f6e3bd', ground:'#dfb777', road:'#efd09a', edge:'#f6dcae', sun:'#efb766'},
    autumn: {index:'03', en:'AUTUMN', name:'落叶铺满旧街道', desc:'让车铃声，落在城市温柔的黄昏里。', route:'落叶街道 · 城市环线', sky:'#f0e1cd', ground:'#c5b286', road:'#b7b5a4', edge:'#d5c9a9', sun:'#edc38f'},
    winter: {index:'04', en:'WINTER', name:'雪山寄来一封信', desc:'沿着闪闪发亮的冰面，寻找冬日的暖意。', route:'冰封雪地 · 雪山环线', sky:'#dfecef', ground:'#d8e9e8', road:'#afd3d7', edge:'#f4f8ef', sun:'#f8edc4'}
  };
  function node(tag, attrs = {}, parent) {
    const el = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
    if (parent) parent.append(el);
    return el;
  }
  const path = (d, fill, extra = '') => `<path d="${d}" fill="${fill}" ${extra}/>`;
  function tree(x, y, color, size = 1) {
    return `<g transform="translate(${x} ${y}) scale(${size})"><path d="M0 0v-85m0 40-28-20m28 5 25-22" fill="none" stroke="#7c7860" stroke-width="8" stroke-linecap="round"/><path d="M-41-65C-76-80-57-113-39-110-58-140-16-155 0-135 23-165 65-133 44-110 81-92 47-55 19-67 6-43-20-47-26-65Z" fill="${color}"/><path d="M-15-116q-16 3-18 13m47-15q13-1 17 9" stroke="#ffffff35" stroke-width="4" fill="none" stroke-linecap="round"/></g>`;
  }
  function landscape(key) {
    let far = '', near = '', front = '';
    if (key === 'spring') {
      far = path('M0 369Q160 226 350 343T690 303 1030 328 1440 286V460H0Z','#b9cf99') + path('M0 410Q160 315 400 372T810 341 1170 374 1440 351V460H0Z','#c9d9a7');
      near = tree(155,444,'#93b181',.9)+tree(1210,438,'#9bb885',1.1)+tree(1035,428,'#adc18b',.65);
      for(let i=0;i<28;i++) front += `<use href="#flower" transform="translate(${i*55+8} ${i%3===0?636:466}) scale(${i%3===0?.9:.6})" style="color:#f1b7a9"/>`;
      front += path('M1040 644q8-22 16 0m17 4q5-16 10 0M300 626l5-15 6 16m-20 2-5-8','#8eae68','stroke="#7e9d5d" stroke-width="2"');
    } else if (key === 'summer') {
      far = path('M0 390Q225 242 444 354T882 355 1440 301V461H0Z','#eac78d');
      far += path('M300 377 456 184 608 377Z','#cfaa70')+path('M456 184 486 377H608Z','#bd945c')+path('M839 386 1001 162 1172 386Z','#d8ad70')+path('M1001 162 1031 386h141Z','#bf955f');
      far += '<g fill="none" stroke="#b68d57" stroke-width="2" opacity=".45"><path d="M382 276h146m-168 29h190m-213 30h236m326-79h137m-159 31h183m-205 31h230m-252 31h277"/></g>';
      near = path('M0 445Q254 346 522 405T1046 406 1440 400V480H0Z','#e2bc7b');
      near += '<g fill="#c6a16b" stroke="#b69363" stroke-width="3"><path d="M1185 434v-63h31v63m-45-63h58v-12h-58ZM1270 434v-50h24v50m-37-50h49v-11h-49Z"/><path d="M1120 436h210v12h-210Z"/></g>';
      front = '<g fill="none" stroke="#91a57b" stroke-width="13" stroke-linecap="round"><path d="M180 475v-63m0 36h-22v-25m22 13h24v-29M1250 632v-50m0 21h-17v-17"/></g><g fill="#cfa569"><ellipse cx="60" cy="624" rx="21" ry="7"/><ellipse cx="1100" cy="470" rx="15" ry="5"/></g>';
    } else if (key === 'autumn') {
      const colors=['#b7b8aa','#c7bdae','#b5b9ac','#c4b0a0'];
      for(let i=0;i<13;i++) {
        const x=i*121, h=85+(i*37%115), y=427-h;
        far += `<rect x="${x}" y="${y}" width="98" height="${h}" rx="5" fill="${colors[i%4]}"/><path d="M${x-5} ${y}h108" stroke="#9eaa9b" stroke-width="5" stroke-linecap="round"/>`;
        for(let r=0;r<Math.floor(h/30)-1;r++) for(let c=0;c<3;c++) far+=`<rect x="${x+15+c*26}" y="${y+18+r*29}" width="12" height="16" rx="2" fill="#e6ddbc" opacity=".85"/>`;
      }
      near = tree(153,451,'#c48c59',1.17)+tree(1216,450,'#c79b5e',1.2)+tree(1033,441,'#c9a878',.7);
      near += '<g stroke="#79867a" stroke-width="5" fill="none" stroke-linecap="round"><path d="M330 450V306q0-19 20-19h20M1320 452V302q0-19 20-19h20"/></g><g fill="#f4e9b8" stroke="#79867a" stroke-width="3"><path d="M354 289h27v13h-27Zm990-4h27v13h-27Z"/></g>';
      for(let i=0;i<48;i++) {const x=i*33, y=i%3?463:631;front+=`<ellipse cx="${x}" cy="${y+i%7}" rx="${5+i%4}" ry="3" transform="rotate(${i*21} ${x} ${y+i%7})" fill="${['#cc9457','#aa7751','#debc72'][i%3]}"/>`;}
    } else {
      far = path('M-60 432 235 154 513 432 789 117 1116 433 1300 219 1530 435Z','#aac4cc')+path('M235 154 130 253 207 229 238 258 263 229 324 243Z','#f6f8ed')+path('M789 117 659 244 751 211 786 241 824 201 901 224Z','#f6f8ed')+path('M1300 219 1228 295 1282 282 1307 306 1332 279 1381 306Z','#f6f8ed');
      far += path('M0 418Q280 349 540 416T1020 404 1440 405V460H0Z','#c2d9dd');
      for (const x of [110,210,1120,1230,1340]) near+=`<g transform="translate(${x} 443)"><path d="M0 0v-82" stroke="#839e9c" stroke-width="8"/><path d="M-39-15 0-80 39-15Z" fill="#92b4af"/><path d="M-31-47 0-103 31-47Z" fill="#a5c4bb"/><path d="M-22-65 0-103 22-65l-19 5-9-8-9 6Z" fill="#f7f9ef"/><path d="M-41-13q41-13 82 0" stroke="#f7f9ef" stroke-width="7" stroke-linecap="round"/></g>`;
      front = '<g fill="#f7faf2"><ellipse cx="160" cy="473" rx="60" ry="9"/><ellipse cx="1210" cy="626" rx="92" ry="12"/><ellipse cx="405" cy="640" rx="52" ry="7"/></g><g stroke="#e1f0eb" stroke-width="2" fill="none"><path d="m180 567 33-13-12-8 40-12m843 48 34-16-10-7 27-9"/></g>';
    }
    $('far-landscape').innerHTML = `<g>${far}</g><g transform="translate(1440)">${far}</g>`;
    $('near-landscape').innerHTML = `<g>${near}</g><g transform="translate(1440)">${near}</g>`;
    $('foreground').innerHTML = `<g>${front}</g><g transform="translate(1440)">${front}</g>`;
  }
  function setSeason(key) {
    if (!Object.hasOwn(themes,key)) return;
    season=key; const theme=themes[key];
    for(const [css,field] of [['sky','sky'],['ground','ground'],['road','road'],['road-edge','edge']]) stage.style.setProperty('--'+css,theme[field]);
    $('sun').firstElementChild.setAttribute('fill',theme.sun);
    $('scene-kicker').textContent=`CHAPTER ${theme.index} / ${theme.en}`;
    $('scene-name').textContent=theme.name; $('scene-desc').textContent=theme.desc;
    $('route-id').textContent='S · '+theme.index; $('route-text').textContent=theme.route;
    document.querySelectorAll('.season-menu [data-season]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.season===key)));
    landscape(key); obstacles=[]; $('obstacles').replaceChildren(); nextObstacle=travel+730;
    $('weather').replaceChildren(); flakes=[];
    for(let i=0;i<18;i++) {
      const el=node(key==='autumn'?'ellipse':'circle',key==='autumn'?{rx:5,ry:2.5,fill:i%2?'#c48c59':'#dec071'}:{r:key==='winter'?2.5:2,fill:key==='winter'?'#fffef5':key==='spring'?'#fff6d5':'#d1a264'},$('weather'));
      flakes.push({el,x:Math.random()*1440,y:Math.random()*460,rate:9+Math.random()*19});
    }
    $('status').textContent='已切换到'+theme.route;
    stage.dataset.season=key;
  }
  const jumpHeight = p => p<=0||p>=1 ? 0 : 145*Math.pow(Math.sin(Math.PI*p),.72);
  const heroX = () => baseX + Math.sin(time*.65)*17;
  function beginJump(auto=false) {
    if(!running || jump) return;
    jump={start:travel,length:790,auto};
    $('jump-bubble').setAttribute('opacity','1');
  }
  function spawnObstacle() {
    const height=28+Math.random()*16, x=1530, el=node('g',{},$('obstacles'));
    const outline='stroke="#68765b" stroke-width="3" stroke-linejoin="round"';
    let shape='';
    if(season==='spring') shape=path(`M-27 0Q-35-${height*.65}-12-${height}Q13-${height+11} 28-6L24 0Z`,'#9baf8c',outline)+path(`M-15-${height*.6}q10-9 19-5`,'none','stroke="#c7d1b1" stroke-width="4" stroke-linecap="round"');
    if(season==='summer') shape=path(`M-27 0-22-${height*.65}-5-${height} 18-${height*.72} 29-2 22 0Z`,'#ba9060',outline)+path(`M-5-${height} 2-11l24 7`,'none','stroke="#d6ad74" stroke-width="3"');
    if(season==='autumn') shape=`<rect x="-30" y="-${height}" width="60" height="${height}" rx="${height/2}" fill="#a7835b" ${outline}/><ellipse cx="19" cy="-${height/2}" rx="10" ry="${height/2-3}" fill="#d4b17c" stroke="#896d4f" stroke-width="2"/><path d="M-23-${height*.65}h28m-24 12h17" stroke="#7d684e" stroke-width="2" stroke-linecap="round"/>`;
    if(season==='winter') shape=path(`M-31 0Q-31-${height*.6}-13-${height*.65}Q-1-${height+15} 16-${height*.7}Q33-${height*.6} 31 0Z`,'#f6fbf4','stroke="#8bafb5" stroke-width="3"')+path('M-24-4h48','none','stroke="#c2e1df" stroke-width="4" stroke-linecap="round"');
    el.innerHTML=`<ellipse cy="2" rx="34" ry="5" fill="#526448" opacity=".12"/>${shape}`;
    obstacles.push({x,height,el,cleared:false});
  }
  function updateControls() {
    $('pause').setAttribute('aria-pressed',String(!running));
    $('pause-label').textContent=running?'暂停漫游':'继续漫游';
    $('pause-icon').setAttribute('d',running?'M5 3h3v14H5zm7 0h3v14h-3z':'M5 2 17 10 5 18Z');
    $('live-text').textContent=running?'自动漫游中':'漫游已暂停';
    $('jump').disabled=!running;
    stage.dataset.running=String(running);
  }
  function render() {
    const x=heroX(), p=jump?(travel-jump.start)/jump.length:0, lift=jump?jumpHeight(p):0;
    const bob=jump?0:Math.sin(time*8)*1.8;
    $('rider-position').setAttribute('transform',`translate(${x} ${ground})`);
    $('rider-jump').setAttribute('transform',`translate(0 ${-lift+bob}) rotate(${jump?-7*Math.sin(p*Math.PI*2):Math.sin(time*3)*.45} 0 -35)`);
    $('bicycle').setAttribute('transform',`rotate(${jump?-8*Math.sin(p*Math.PI):0} -125 -166)`);
    $('wing').setAttribute('transform',`rotate(${jump?42*Math.sin(p*Math.PI):-3+Math.sin(time*4)*3} -72 -87)`);
    $('neck').setAttribute('transform',`rotate(${jump?-9*Math.sin(p*Math.PI):Math.sin(time*3)*1.2} 112 -90)`);
    $('shadow').setAttribute('cx',x+10); $('shadow').setAttribute('rx',227-lift*.37); $('shadow').setAttribute('opacity',.16-lift*.00045);
    document.querySelectorAll('.rolling').forEach(el=>el.setAttribute('transform',`rotate(${travel*2.3})`));
    document.querySelectorAll('.bike-rolling').forEach(el=>el.setAttribute('transform',`rotate(${travel*1.15})`));
    $('crank').setAttribute('transform',`rotate(${travel*1.6} -16 -166)`);
    $('front-leg').setAttribute('transform',`rotate(${Math.sin(time*9)*13} -73 -272)`);
    $('back-leg').setAttribute('transform',`rotate(${-Math.sin(time*9)*12} -91 -273)`);
    $('tail').setAttribute('transform',`rotate(${Math.sin(time*6)*8} -108 -296)`);
    $('gills-left').setAttribute('transform',`rotate(${Math.sin(time*6)*4+(jump?-12:0)} -121 -335)`);
    $('gills-right').setAttribute('transform',`rotate(${-Math.sin(time*6)*4+(jump?12:0)} -54 -335)`);
    $('eyes').setAttribute('opacity',time%5.5>5.35?'0':'1');
    $('far-landscape').setAttribute('transform',`translate(${-travel*.075%1440} 0)`);
    $('near-landscape').setAttribute('transform',`translate(${-travel*.22%1440} 0)`);
    $('foreground').setAttribute('transform',`translate(${-travel%1440} 0)`);
    $('road-marks').setAttribute('transform',`translate(${-travel%180} 0)`);
    $('clouds').setAttribute('transform',`translate(${-Math.sin(time*.05)*65} 0)`);
    $('distance').textContent=Math.floor(distance); $('jump-count').textContent=jumps;
    stage.dataset.airborne=String(Boolean(jump)); stage.dataset.travel=travel.toFixed(2);
    for(const o of obstacles) o.el.setAttribute('transform',`translate(${o.x} ${ground})`);
    for(const f of flakes) {
      const fx=((f.x-time*(season==='winter'?22:38))%1490+1490)%1490-25;
      const fy=(f.y+time*f.rate)%485;
      f.el.setAttribute('transform',`translate(${fx} ${fy}) rotate(${time*30})`);
      f.el.setAttribute('opacity',season==='summer'?.25:.75);
    }
  }
  function advance(dt) {
    const step=dt*230*speed;
    time+=dt*speed; travel+=step; distance+=step/36;
    for(const o of obstacles) o.x-=step;
    // Every jump begins outside the full silhouette; keep it airborne until the obstacle is behind it.
    const ahead=obstacles.find(o=>!o.cleared&&o.x>heroX()-260&&o.x<heroX()+412);
    if(ahead&&!ahead.planned) {
      if(!jump) beginJump(true);
      else jump.length=Math.max(jump.length,travel-jump.start+790);
      ahead.planned=true;
    }
    if(jump&&(travel-jump.start)>=jump.length) {
      jump=null; $('jump-bubble').setAttribute('opacity','0');
    }
    for(const o of obstacles) if(!o.cleared&&o.x<heroX()-250) {o.cleared=true;jumps++;}
    obstacles=obstacles.filter(o=>{if(o.x<-80){o.el.remove();return false;}return true;});
    if(travel>=nextObstacle) {spawnObstacle();nextObstacle=travel+1010+Math.random()*500;}
  }
  function frame(timestamp) {
    const dt=last?Math.min((timestamp-last)/1000,.04):0;last=timestamp;
    if(running&&!document.hidden) advance(dt);
    render();requestAnimationFrame(frame);
  }
  function selfCheck() {
    // Test the shared jump curve across all obstacle overlap positions, including moving-rider margins.
    for(let d=67;d<=713;d+=1) if(jumpHeight(d/790)<44+4) throw new Error('跳跃净空自检失败');
    if(jumpHeight(0)!==0||jumpHeight(1)!==0||jumpHeight(.5)!==145) throw new Error('跳跃曲线自检失败');
    if(document.querySelectorAll('.season-menu [data-season]').length!==4) throw new Error('四季菜单自检失败');
    if(document.querySelectorAll('#pelican .rolling').length!==4) throw new Error('四轮结构自检失败');
    if(document.querySelectorAll('#axolotl rect').length<35) throw new Error('像素结构自检失败');
    document.documentElement.dataset.selfCheck='passed';
  }
  document.querySelectorAll('.season-menu [data-season]').forEach(b=>b.addEventListener('click',()=>setSeason(b.dataset.season)));
  $('pause').addEventListener('click',()=>{running=!running;updateControls();});
  $('jump').addEventListener('click',()=>beginJump());
  $('speed').addEventListener('input',e=>{speed=Number(e.target.value);$('speed-label').textContent=speed.toFixed(1)+'×';});
  document.addEventListener('keydown',e=>{
    if(e.code==='Space'&&!e.repeat&&!/^(INPUT|BUTTON|SELECT|TEXTAREA)$/.test(e.target.tagName)) {e.preventDefault();beginJump();}
  });
  document.addEventListener('visibilitychange',()=>{last=0;});
  for(let i=0;i<10;i++) node('path',{d:`M${i*180} 541h64`},$('road-marks'));
  for(let i=0;i<32;i++) node('ellipse',{cx:i*47,cy:490+(i*17%88),rx:1+i%3,ry:1,fill:'#697e5b',opacity:.13},$('road-details'));
  try {setSeason('spring');updateControls();selfCheck();render();requestAnimationFrame(frame);}
  catch(error) {$('fatal').hidden=false;$('fatal').textContent='动画启动失败：'+error.message;console.error(error);}
})();
</script>
</body>
</html>
